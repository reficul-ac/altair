name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install formatter tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          python3 -m pip install --break-system-packages black cmake-format

      - name: Check formatting
        run: python3 tools/python/format_repo.py --check

  cmake-test:
    name: cmake-test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Verify Bayek submodule
        run: |
          git submodule status --recursive
          test -f bayek/CMakeLists.txt

      - name: Configure
        run: cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DALTAIR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure

  animus:
    name: animus
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/animus

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/animus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate
