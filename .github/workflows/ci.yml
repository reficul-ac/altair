name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  format-check:
    name: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install formatter tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          python3 -m pip install --break-system-packages black cmake-format

      - name: Check formatting
        run: python3 tools/python/format_repo.py --check

  cmake-test:
    name: cmake-test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Verify Bayek submodule
        run: |
          git submodule status --recursive
          test -f bayek/CMakeLists.txt

      - name: Configure
        run: cmake -S . -B build-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DALTAIR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build-${{ matrix.build_type }} --output-on-failure

  animus-qt:
    name: animus-qt
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            xvfb \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-positioning-dev \
            qt6-webchannel-dev \
            qt6-webengine-dev \
            qt6-webengine-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtwebchannel \
            qml6-module-qtwebengine

      - name: Configure
        run: cmake -S . -B build-animus-qt -G Ninja -DALTAIR_BUILD_ANIMUS_QT=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-animus-qt --target animus_qt animus_qt_unit_tests --parallel

      - name: Test
        run: ctest --test-dir build-animus-qt --output-on-failure -R animus_qt

      - name: Capture screenshots
        run: python3 tools/python/capture_animus_qt_sitl.py
