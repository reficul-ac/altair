<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animus Cesium</title>
    <style>
      html, body, #scene {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #d7e3df;
        color: #1f2a2a;
        font-family: system-ui, sans-serif;
      }
      #scene {
        display: grid;
        place-items: center;
      }
      .panel {
        border: 1px solid #9caaa5;
        background: rgba(247, 247, 243, 0.94);
        border-radius: 6px;
        padding: 18px;
        min-width: 280px;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="panel">
        <strong>Cesium terrain placeholder</strong>
        <div id="vehicle">Waiting for Qt WebChannel...</div>
      </div>
    </div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="animus-cesium.js"></script>
  </body>
</html>
