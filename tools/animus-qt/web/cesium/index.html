<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animus Terrain 3D</title>
    <link rel="stylesheet" href="vendor/Cesium/Widgets/widgets.css">
    <style>
      html, body, #scene {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #d7e3df;
        color: #1f2a2a;
        font-family: system-ui, sans-serif;
      }
      #scene, #fallbackScene {
        position: absolute;
        inset: 0;
      }
      #fallbackScene {
        display: none;
      }
      #cesiumScene {
        position: absolute;
        inset: 0;
        display: none;
      }
      #cesiumScene .cesium-viewer,
      #cesiumScene .cesium-viewer-cesiumWidgetContainer,
      #cesiumScene .cesium-widget,
      #cesiumScene canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #status {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 8px 10px;
        border: 1px solid #9caaa5;
        background: rgba(247, 247, 243, 0.92);
        border-radius: 6px;
        font-size: 13px;
        max-width: min(560px, calc(100% - 24px));
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="cesiumScene"></div>
      <canvas id="fallbackScene"></canvas>
      <div id="status">Waiting for Animus terrain state...</div>
    </div>
    <script>
      window.CESIUM_BASE_URL = "qrc:/Animus/web/cesium/vendor/Cesium/";
    </script>
    <script src="vendor/Cesium/Cesium.js"></script>
    <script src="vehicleModel.js"></script>
    <script src="animus-cesium.js"></script>
  </body>
</html>
